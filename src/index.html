<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="css/output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="relative text-white">
    <header class="absolute top-0 left-0 right-0 z-50 bg-transparent">
      <nav class="flex items-center justify-center py-3">
        <img class="w-36" src="/src/images/logo-putih.png" alt="" />
      </nav>
    </header>
    <main class="">
      <section
        id="hero"
        class="relative overflow-hidden flex flex-col items-center min-h-screen justify-center pt-32"
      >
        <div
          class="absolute inset-0 bg-gradient-to-r from-merah to-biru h-screen"
        ></div>

        <div
          class="absolute inset-0"
          style="
            background-image: repeating-linear-gradient(
              90deg,
              rgba(255, 255, 255, 0.08) 0px,
              rgba(255, 255, 255, 0) 60px
            );
          "
        ></div>
        <div class="relative flex flex-col items-center">
          <h1
            class="flex items-center justify-center text-center text-5xl font-semibold"
          >
            Lorem ipsum dolor sit amet <br />
            consectetur.
          </h1>
          <button class="bg-biru px-6 py-2.5 rounded-4xl mt-7 text-white shadow-md">
            Lorem Ipsum
          </button>
        </div>

        <div class="w-full relative -translate-y-10">
          <svg
            viewBox="0 0 1200 200"
            class="w-full overflow-visible"
            preserveAspectRatio="none"
          >
            <defs>
              <path
                id="ribbonPath"
                d="M -40 150 Q 300 20, 600 100 T 1240 20"
                fill="none"
              />
            </defs>

            <!-- tali kuning -->
            <use
              href="#ribbonPath"
              stroke="#FFD84D"
              stroke-width="45"
              stroke-linecap="butt"
              fill="none"
            />

            <!-- teks di tengah tali, diulang otomatis -->
            <text
              class="fill-neutral-900 text-[13px] font-medium tracking-wide"
              dy="4"
            >
              <textPath href="#ribbonPath" startOffset="0%">
                Lorem. Ipsum. Dolor Sit Amet. &#8226; Lorem. Ipsum. Dolor Sit
                Amet. &#8226;Lorem. Ipsum. Dolor Sit Amet. &#8226;Lorem. Ipsum.
                Dolor Sit Amet. &#8226;Lorem. Ipsum. Dolor Sit Amet.
                &#8226;Lorem. Ipsum. Dolor Sit Amet. &#8226;
              </textPath>
            </text>
          </svg>
        </div>

        <div class="relative -translate-y-10">
          <ul
            class="flex items-center gap-2 border-y border-white py-1.5 px-6 rounded-4xl bg-white/20 backdrop-blur-xs shadow-md"
          >
            <li class="mr-10">
              <img class="w-24" src="/src/images/logo-putih.png" alt="" />
            </li>
            <li
              class="flex items-center gap-2 py-3 px-5 rounded-full bg-gradient-to-r from-merah to-biru backdrop-blur-xs shadow-sm"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                fill="currentColor"
                class="bi bi-laptop"
                viewBox="0 0 16 16"
              >
                <path
                  d="M13.5 3a.5.5 0 0 1 .5.5V11H2V3.5a.5.5 0 0 1 .5-.5zm-11-1A1.5 1.5 0 0 0 1 3.5V12h14V3.5A1.5 1.5 0 0 0 13.5 2zM0 12.5h16a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 12.5"
                />
              </svg>
              Desktop
            </li>
            <li
              class="flex items-center gap-2 py-3 px-5 rounded-full bg-biru backdrop-blur-xs shadow-sm"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-phone"
                viewBox="0 0 16 16"
              >
                <path
                  d="M11 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM5 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"
                />
                <path d="M8 14a1 1 0 1 0 0-2 1 1 0 0 0 0 2" />
              </svg>

              Mobile
            </li>
            <li
              class="flex items-center gap-2 py-3 px-5 rounded-full bg-white/10 border-y border-white backdrop-blur-xs shadow-sm"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-card-text"
                viewBox="0 0 16 16"
              >
                <path
                  d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2z"
                />
                <path
                  d="M3 5.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5M3 8a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9A.5.5 0 0 1 3 8m0 2.5a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1h-6a.5.5 0 0 1-.5-.5"
                />
              </svg>
              Article
            </li>
            <li
              class="flex items-center gap-2 py-3 px-5 rounded-full bg-white text-black backdrop-blur-xs shadow-sm"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-layout-sidebar"
                viewBox="0 0 16 16"
              >
                <path
                  d="M0 3a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm5-1v12h9a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zM4 2H2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h2z"
                />
              </svg>

              Widget
            </li>
            <li class="flex items-center gap-2 py-3 px-5 rounded-full bg-merah">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-grid-1x2"
                viewBox="0 0 16 16"
              >
                <path
                  d="M6 1H1v14h5zm9 0h-5v5h5zm0 9v5h-5v-5zM0 1a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1zm9 0a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1zm1 8a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1z"
                />
              </svg>
              Custom
            </li>
            <li class="flex items-center gap-2 py-3 px-5 rounded-full">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-play-btn"
                viewBox="0 0 16 16"
              >
                <path
                  d="M6.79 5.093A.5.5 0 0 0 6 5.5v5a.5.5 0 0 0 .79.407l3.5-2.5a.5.5 0 0 0 0-.814z"
                />
                <path
                  d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm15 0a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1z"
                />
              </svg>
              VOB
            </li>
          </ul>
        </div>
      </section>

      <section>
        <h2>tess</h2>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
