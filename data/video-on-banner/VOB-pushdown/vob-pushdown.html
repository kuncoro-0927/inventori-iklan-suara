<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Video on Banner</title>
  </head>
  <body>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      html,
      body {
        width: 320px;
        height: 480px;
        overflow: hidden;
      }
      .vobWrap {
        width: 320px;
        height: 480px;
        overflow: hidden;
      }
      .video-on-banner {
        position: relative;
        width: 320px;
        height: 480px;
      }
      .imageArea,
      .videoArea,
      .bannerLink {
        position: absolute;
      }
      .videoArea {
        bottom: 0px;
      }
      .iframe-container,
      .iframe-container iframe {
        width: 320px;
        height: 180px;
      }
      a.bannerLink {
        background-color: transparent;
        width: 320px;
        height: 300px;
      }
    </style>
    <div class="vobWrap">
      <div class="video-on-banner">
        <div class="imageArea">
          <img src="assets/images/320x480.png" />
        </div>
        <div class="videoArea">
          <div class="iframe-container">
            <div id="player"></div>
          </div>
        </div>
        <a
          href="https://www.suara.com/"
          class="bannerLink"
          target="_blank"
        ></a>
      </div>
    </div>
    <script>
      var tag = document.createElement("script");

      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var player;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player("player", {
          width: "100%",
          videoId: "6f5wBMFp5dQ",
          playerVars: {
            autoplay: 1,
            playsinline: 1,
            loop: 1,
          },
          events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
          },
        });
      }

      function onPlayerReady(event) {
        event.target.mute();
        event.target.playVideo();
      }
      var done = true;
      function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.ENDED) {
          player.playVideo();
        }
      }
    </script>
  </body>
</html>
