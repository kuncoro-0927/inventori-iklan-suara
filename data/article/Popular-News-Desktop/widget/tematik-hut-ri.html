<style>
  /* widget */
  .widget-hut-tematik {
    width: 300px;
    height: 600px;
    background: url("assets/images/widget/bg-hut-ri.png") center center / cover
      no-repeat;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;

    position: relative;
    overflow: hidden;
  }
  /* Diposisikan di bawah logo/background */
  .widget-hut-tematik__content {
    position: absolute;
    top: 155px; /* sesuaikan dengan logo */
    left: 18px;
    right: 18px;
  }

  .widget-news-item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .widget-news-item img {
    width: 105px;
    height: 60px;
    border-radius: 6px;
    object-fit: cover;
    display: block;
  }

  .widget-news-item__body {

  }

  .widget-news-item__title {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    font-weight: 700;
  }

  .widget-news-item__title a {
    color: #222; /* Hitam agar jelas */

    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .widget-news-item__title a:hover {
    color: #d80000;
  }

  .widget-hut-tematik__footer {
    position: absolute;
    left: 50%;
    bottom: 60px;
    transform: translateX(-50%);

    background: #fff;
    border-radius: 20px;
    padding: 10px 18px;

  .widget-hut-tematik__footer a {
